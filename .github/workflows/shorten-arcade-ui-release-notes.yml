name: Shorten existing Arcade Hall UI release notes
on:
  push:
    branches: [ 'maintenance/shorten-arcade-ui-release-notes' ]
    paths: [ '.github/workflows/shorten-arcade-ui-release-notes.yml' ]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update release notes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'heplus1s/MinecraftUIMod' ]]
          [[ "$(gh api "/repos/$GITHUB_REPOSITORY/releases/453495174" --jq .tag_name)" == 'arcadehall-ui-v0.1.4' ]]
          [[ "$(gh api "/repos/$GITHUB_REPOSITORY/releases/453413548" --jq .tag_name)" == 'arcadehall-ui-v0.1.3' ]]
          [[ "$(gh api "/repos/$GITHUB_REPOSITORY/releases/452929275" --jq .tag_name)" == 'arcadehall-ui-v0.1.2' ]]
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/453495174" -F body=@- --jq '{tag_name,asset_count:(.assets|length)}' <<'NOTES'
          Added improvements and fixed several issues.

          Requires Minecraft 1.20.1, Java 17, Fabric Loader 0.15.10 or later, and Fabric API. Do not install alongside the integrated Arcade Hall JAR.
          NOTES
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/453413548" -F body=@- --jq '{tag_name,asset_count:(.assets|length)}' <<'NOTES'
          Added new features and fixed several issues.

          Requires Minecraft 1.20.1, Java 17, Fabric Loader 0.15.10 or later, and Fabric API. Do not install alongside the integrated Arcade Hall JAR.
          NOTES
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/452929275" -F body=@- --jq '{tag_name,asset_count:(.assets|length)}' <<'NOTES'
          Standalone client release.

          Requires Minecraft 1.20.1, Java 17, Fabric Loader 0.15.10 or later, and Fabric API. Do not install alongside the integrated Arcade Hall JAR.
          NOTES
