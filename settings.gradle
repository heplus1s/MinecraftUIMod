pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "minecraft-ui-mod"

include "bank-ui"
include "land-ui"

// shop-ui and market-ui are reserved folders. They are not Gradle modules until those packs exist.
